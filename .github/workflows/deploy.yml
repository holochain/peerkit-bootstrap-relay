name: Deploy

# Manual deploy of the peerkit bootstrap/relay to its DigitalOcean droplet.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or branch) to deploy"
        required: true
        type: string
        default: "main"

concurrency:
  group: deploy-relay
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: "ubuntu-latest"
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Configure SSH credentials
        # ZIZMOR-TEMPLATE-INJECTION: secrets piped via env to a fixed script.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy
        # ZIZMOR-TEMPLATE-INJECTION: inputs/secrets passed via env, not inlined.
        env:
          RELEASE_REF: ${{ inputs.ref }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY_PATH: ${{ runner.temp }}/ssh/id
          DEPLOY_KNOWN_HOSTS_PATH: ${{ runner.temp }}/ssh/known_hosts
          PEERKIT_NETWORK_SECRET: ${{ secrets.PEERKIT_NETWORK_SECRET }}
          PEERKIT_OTEL_OTLP_ENDPOINT: ${{ secrets.PEERKIT_OTEL_OTLP_ENDPOINT }}
          PEERKIT_OTEL_HEADERS: ${{ secrets.PEERKIT_OTEL_HEADERS }}
          PEERKIT_PUBLIC_HOST: ${{ secrets.PEERKIT_PUBLIC_HOST }}
          PEERKIT_RELAY_LISTEN_ADDRS: ${{ secrets.PEERKIT_RELAY_LISTEN_ADDRS }}
        run: bash scripts/deploy.sh

      - name: Upload multiaddr artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relay-multiaddr
          path: relay-multiaddr.txt
          if-no-files-found: ignore
