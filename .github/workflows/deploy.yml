name: Deploy relay

# Manually triggered. Deploys the relay onto the ONE long-lived DigitalOcean
# droplet named by DROPLET_NAME, creating it from infra/cloud-init.yaml only if
# it does not exist yet. A normal deploy reuses the droplet: it delivers the
# network secret and the persisted relay certificate over SSH, then runs
# infra/deploy.sh on-box to check out the resolved commit, rebuild, reinstall
# the systemd unit and non-secret env, and restart the relay.
#
# The Reserved IP is what peers dial, so it is assigned to the droplet whenever
# it is not already pointing there, and the run fails if it cannot be assigned.
#
# The relay cert is generated once, locally, with scripts/gen-cert.mjs
# (npm run gen-cert) and stored verbatim as the RELAY_CERT_JSON secret. It is
# NOT regenerated per deploy, so the certhash never changes. The cert is valid
# for 5 years - re-mint it and update the secret before it expires.
#
# `recreate: true` builds a replacement droplet instead of reusing the existing
# one - needed when infra/cloud-init.yaml changes (Node major, packages,
# firewall), since that file only runs at first boot. The old droplet is
# renamed and left running so a bad deploy is rolled back by reassigning the
# Reserved IP back to it; delete it manually after verifying.
on:
  workflow_dispatch:
    inputs:
      repo_ref:
        description: Git branch or tag to build the relay from
        required: true
        default: main
      region:
        description: DO region slug (only used when a droplet is created)
        required: true
        default: lon1
      size:
        description: DO droplet size slug (only used when a droplet is created)
        required: true
        default: s-1vcpu-2gb
      recreate:
        description: Build a replacement droplet instead of reusing the existing one
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

env:
  # Single droplet per repo - name is fixed, not an input. It is also the
  # lookup key for reuse, so exactly one droplet may carry it.
  DROPLET_NAME: peerkit-bootstrap-relay

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets and the RESERVED_IP variable live in this Actions environment.
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # The ref is resolved to a full commit SHA here, once, and the droplet
      # checks out that exact SHA. Resolving it on-box instead would let a
      # branch move between the summary and the build.
      - name: Resolve commit
        id: resolve
        env:
          REPO_REF: ${{ inputs.repo_ref }}
          RESERVED_IP: ${{ vars.RESERVED_IP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RESERVED_IP" ]; then
            echo "::error::RESERVED_IP variable is not set"; exit 1
          fi
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REPO_REF}" --jq '.sha')
          echo "resolved ${REPO_REF} -> ${sha}"
          echo "commit_sha=$sha" >> "$GITHUB_OUTPUT"

      # Reuse the existing droplet; create one only when none exists or the run
      # explicitly asks for a replacement.
      - name: Find or create droplet
        id: droplet
        env:
          NAME: ${{ env.DROPLET_NAME }}
          REGION: ${{ inputs.region }}
          SIZE: ${{ inputs.size }}
          RECREATE: ${{ inputs.recreate }}
          # Comma-separated SSH key fingerprints, one per authorized operator.
          SSH_KEYS: ${{ secrets.DO_SSH_KEY_FINGERPRINTS }}
          SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          # Exact-name match: `doctl compute droplet list <name>` globs, and a
          # stale `-old-*` droplet must never be mistaken for the live one.
          matches=$(doctl compute droplet list --no-header --format ID,Name \
            | awk -v n="$NAME" '$2 == n { print $1 }')
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -gt 1 ]; then
            echo "::error::found $count droplets named $NAME; deploy needs exactly one - rename or delete the extras"
            exit 1
          fi
          existing=$matches

          if [ -n "$existing" ] && [ "$RECREATE" != "true" ]; then
            id=$existing
            echo "reusing droplet $id"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$existing" ]; then
              # Free the name before creating the replacement so the next run's
              # lookup stays unambiguous. The old droplet keeps running for
              # rollback.
              old_name="${NAME}-old-${SHA:0:7}"
              echo "renaming droplet $existing -> $old_name"
              doctl compute droplet-action rename "$existing" --droplet-name "$old_name" --wait
              echo "previous_droplet_id=$existing" >> "$GITHUB_OUTPUT"
            fi
            echo "creating droplet $NAME"
            id=$(doctl compute droplet create "$NAME" \
              --image ubuntu-24-04-x64 \
              --region "$REGION" --size "$SIZE" \
              --ssh-keys "$SSH_KEYS" \
              --tag-names peerkit \
              --enable-monitoring \
              --user-data-file infra/cloud-init.yaml \
              --wait --no-header --format ID)
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "droplet_id=$id" >> "$GITHUB_OUTPUT"
          ip=$(doctl compute droplet get "$id" --no-header --format PublicIPv4)
          echo "droplet_ip=$ip" >> "$GITHUB_OUTPUT"

      # Deliver the secrets, then run infra/deploy.sh on-box. deploy.sh is
      # copied from this checkout rather than run out of /opt, because it
      # rewrites that checkout while running.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          IP: ${{ steps.droplet.outputs.droplet_ip }}
          SHA: ${{ steps.resolve.outputs.commit_sha }}
          RESERVED_IP: ${{ vars.RESERVED_IP }}
          NETWORK_SECRET: ${{ secrets.PEERKIT_NETWORK_SECRET }}
          RELAY_CERT_JSON: ${{ secrets.RELAY_CERT_JSON }}
        run: |
          # Remove every secret file on ANY exit, not just the success path, so
          # a failed validation/SSH/SCP/restart never leaves them in the
          # workspace for later steps.
          trap 'rm -f key relay-cert.json relay-secrets.env' EXIT
          # Trailing newline required - OpenSSH rejects a key file without one.
          printf '%s\n' "$SSH_KEY" > key && chmod 600 key
          if ! ssh-keygen -y -f key >/dev/null 2>&1; then
            echo "::error::DO_SSH_PRIVATE_KEY is not a valid OpenSSH private key"
            exit 1
          fi
          ssh_opts=(-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes)
          # shellcheck disable=SC2029  # remote commands are single-quoted literals meant to run on the droplet
          remote() { ssh "${ssh_opts[@]}" "root@${IP}" "$@"; }
          # `doctl --wait` returns at "active", before sshd accepts connections,
          # so early attempts can be reset. Retry until the box answers, then
          # block on cloud-init (a no-op on a droplet that already booted).
          # Transport failure is exit 255 (retry); any other non-zero is a real
          # cloud-init error (hard-fail).
          deadline=$((SECONDS + 900))
          while :; do
            remote 'cloud-init status --wait' && break
            rc=$?
            if [ "$rc" = 255 ]; then
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::droplet SSH never became reachable"; exit 1
              fi
              echo "sshd not ready yet, retrying in 10s..."; sleep 10; continue
            fi
            remote 'cloud-init status --long; tail -n 100 /var/log/cloud-init-output.log' || true
            echo "::error::cloud-init did not finish cleanly on the droplet"
            exit 1
          done

          # Validate inputs before mutating the box.
          if [ -z "$NETWORK_SECRET" ]; then
            echo "::error::PEERKIT_NETWORK_SECRET is empty"; exit 1
          fi
          # The secret is written verbatim into a systemd EnvironmentFile
          # (KEY=value, one line). A newline or other control byte would
          # truncate the value or inject extra assignments, so require a single
          # line of printable ASCII.
          if printf '%s' "$NETWORK_SECRET" | LC_ALL=C grep -qP '[^\x20-\x7e]'; then
            echo "::error::PEERKIT_NETWORK_SECRET must be a single line of printable ASCII"; exit 1
          fi
          umask 077
          printf '%s' "$RELAY_CERT_JSON" > relay-cert.json
          # Require the three non-empty string fields the relay reads; jq -e .
          # alone would accept {}, [], or null.
          if ! jq -e '
              type == "object"
              and (.privateKeyPem | type == "string" and length > 0)
              and (.certificatePem | type == "string" and length > 0)
              and (.certhash | type == "string" and length > 0)
            ' relay-cert.json >/dev/null 2>&1; then
            echo "::error::RELAY_CERT_JSON is not a valid RelayCertificate (need non-empty string privateKeyPem, certificatePem, certhash)"; exit 1
          fi

          # Secrets go in their own EnvironmentFile, rewritten on every deploy
          # so rotating a secret takes effect. infra/deploy.sh never touches it,
          # so re-rendering the non-secret env cannot drop these.
          printf 'PEERKIT_NETWORK_SECRET=%s\n' "$NETWORK_SECRET" > relay-secrets.env
          scp "${ssh_opts[@]}" relay-cert.json "root@${IP}:/tmp/relay-cert.json"
          scp "${ssh_opts[@]}" relay-secrets.env "root@${IP}:/tmp/relay-secrets.env"
          scp "${ssh_opts[@]}" infra/deploy.sh "root@${IP}:/tmp/peerkit-deploy.sh"
          remote 'set -e
                  install -d -o peerkit -g peerkit -m 0750 /opt/peerkit-bootstrap-relay/certs
                  install -o peerkit -g peerkit -m 0640 /tmp/relay-cert.json /opt/peerkit-bootstrap-relay/certs/relay-cert.json
                  install -o root -g peerkit -m 0640 /tmp/relay-secrets.env /etc/peerkit-relay.secrets.env
                  rm -f /tmp/relay-cert.json /tmp/relay-secrets.env'
          remote "set -e
                  COMMIT_SHA='${SHA}' RESERVED_IP='${RESERVED_IP}' bash /tmp/peerkit-deploy.sh
                  rm -f /tmp/peerkit-deploy.sh"

      # The Reserved IP is the address peers dial and the host the relay
      # announces, so it must end up on this droplet. Assigning an already
      # assigned Reserved IP is an error in the DO API, so only move it when it
      # is not already here.
      - name: Assign Reserved IP
        env:
          RESERVED_IP: ${{ vars.RESERVED_IP }}
          ID: ${{ steps.droplet.outputs.droplet_id }}
        run: |
          current=$(doctl compute reserved-ip get "$RESERVED_IP" --no-header --format DropletID)
          if [ "$current" = "$ID" ]; then
            echo "Reserved IP $RESERVED_IP already on droplet $ID"
            exit 0
          fi
          # `assign` moves the IP off whatever droplet holds it, so there is no
          # unassign step to leave it unrouted if the assign then fails.
          echo "Reserved IP $RESERVED_IP currently on '${current:-none}', moving to $ID"
          action_id=$(doctl compute reserved-ip-action assign "$RESERVED_IP" "$ID" --no-header --format ID)
          doctl compute action wait "$action_id"
          echo "Reserved IP $RESERVED_IP -> droplet $ID"

      - name: Summary
        env:
          IP: ${{ steps.droplet.outputs.droplet_ip }}
          ID: ${{ steps.droplet.outputs.droplet_id }}
          CREATED: ${{ steps.droplet.outputs.created }}
          PREVIOUS_ID: ${{ steps.droplet.outputs.previous_droplet_id }}
          SHA: ${{ steps.resolve.outputs.commit_sha }}
          RESERVED_IP: ${{ vars.RESERVED_IP }}
          RELAY_CERT_JSON: ${{ secrets.RELAY_CERT_JSON }}
        run: |
          certhash=$(jq -r '.certhash' <<<"$RELAY_CERT_JSON")
          if [ "$CREATED" = "true" ]; then
            mode="created droplet"
          else
            mode="redeployed onto existing droplet"
          fi
          {
            echo "Relay $mode **$ID** ($IP) at commit \`$SHA\`."
            echo "Reserved IP \`$RESERVED_IP\` points at this droplet. DO monitoring enabled."
            echo ""
            echo "Relay certhash: \`$certhash\` - bake into client dial multiaddrs."
            echo "Announced multiaddr base: \`/ip4/$RESERVED_IP/tcp/4001\`; read the exact"
            echo "\`relay ready\` line from \`journalctl -u peerkit-relay\` for the peer id."
            if [ -n "$PREVIOUS_ID" ]; then
              echo ""
              echo "Replaced droplet **$PREVIOUS_ID**, renamed and left running. Reassign the"
              echo "Reserved IP back to it to roll back, then delete it manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
