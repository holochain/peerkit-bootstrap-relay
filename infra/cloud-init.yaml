#cloud-config
# Base-machine provisioning for the DigitalOcean droplet that runs the PeerKit
# bootstrap/relay (systemd unit: peerkit-relay).
#
# This runs ONCE, when a droplet is first created. It deliberately stops at the
# base machine: OS packages, Node.js, the service user, and the firewall. It
# does NOT clone, build, install the unit, or start the relay - infra/deploy.sh
# does all of that over SSH, on every deploy, so the droplet is reused instead
# of replaced. Nothing here depends on the deployed commit, so this file has no
# placeholders to substitute.
#
# Change something here (Node major, firewall, packages) and an existing
# droplet will NOT pick it up: run the deploy workflow with `recreate: true` to
# build a replacement droplet and move the Reserved IP to it.
#
# Secrets are NOT handled here. The deploy workflow delivers
# PEERKIT_NETWORK_SECRET and the persisted relay certificate over SSH, so
# neither lands in DO user-data (readable on-box by any local process).

packages:
  - git
  - curl
  - ca-certificates
  - build-essential
  - gnupg
  - ufw

runcmd:
  # --- system user owning the relay checkout ---
  - useradd --system --create-home --home-dir /var/lib/peerkit --shell /usr/sbin/nologin peerkit
  - install -d -o peerkit -g peerkit -m 0755 /opt/peerkit-bootstrap-relay

  # --- Node.js 22 (matches engines >=22) ---
  # Add the NodeSource apt repo explicitly with a pinned signing key instead of
  # piping a remote installer into root's shell; apt then verifies the package
  # signature against that key.
  - install -d -m 0755 /etc/apt/keyrings
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  - chmod 0644 /etc/apt/keyrings/nodesource.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
  - apt-get update
  - apt-get install -y nodejs

  # --- firewall: SSH + relay TCP ---
  - ufw allow OpenSSH
  - ufw allow 4001/tcp
  - ufw --force enable
